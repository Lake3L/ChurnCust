[project]
name = "churn-scoring-platform"
version = "0.1.0"
description = "End-to-end churn scoring platform: DVC pipeline, MLflow, cost-sensitive thresholding, calibrated probabilities, FastAPI service, drift monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # serving core: everything the API container needs, nothing more
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.5,<5",
    "mlflow>=2.22,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
# training / research / monitoring — not shipped in the API image
ml = [
    "optuna>=3.6,<5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "dvc>=3.50",
    "evidently>=0.4.40,<0.7",
    "streamlit>=1.36",
    "requests>=2.32",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn", "app"]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "T20", # no print()
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # CLI scripts may print

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/churn --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/churn", "app"]
omit = ["src/churn/monitoring.py"]
